name: Build APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    name: Compilar APK de depuración
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Precargar SDK jars de Robolectric
        shell: bash
        run: |
          set -euo pipefail
          base="$HOME/.m2/repository/org/robolectric/android-all-instrumented"
          # Versiones que Robolectric 4.14.1 resuelve para este proyecto:
          # API 35 (sandbox por defecto del runner), API 28 (@Config(sdk=[28]))
          # y API 34 (targetSdk), todas instrumentadas (i7).
          # El mirror de Google (GCS) es infraestructura oficial de Maven Central y
          # responde mejor desde los runners cuando repo1 se degrada; repo1 queda de
          # respaldo. Timeouts cortos para que el fallo vaya rápido al otro host.
          for v in 15-robolectric-12650502-i7 9-robolectric-4913185-2-i7 14-robolectric-10818077-i7; do
            dir="$base/$v"
            mkdir -p "$dir"
            for f in "android-all-instrumented-$v.pom" "android-all-instrumented-$v.pom.sha1" "android-all-instrumented-$v.jar" "android-all-instrumented-$v.jar.sha1"; do
              if [ -s "$dir/$f" ]; then continue; fi
              ok=0
              for host in "https://maven-central.storage-download.googleapis.com/maven2" "https://repo.maven.apache.org/maven2"; do
                if curl -fsSL --connect-timeout 8 --max-time 120 --retry 2 --retry-delay 3 --retry-all-errors \
                    -o "$dir/$f" "$host/org/robolectric/android-all-instrumented/$v/$f"; then
                  ok=1
                  break
                fi
              done
              case "$f" in
                *.sha1)
                  if [ "$ok" != "1" ]; then echo "Aviso: sin $f (best-effort); la integridad la cubre el jar descargado."; rm -f "$dir/$f"; fi ;;
                *)
                  if [ "$ok" != "1" ]; then
                    echo "No se pudo precargar $f desde ningún host; los tests de Robolectric fallarían al descargarlo en runtime."
                    exit 1
                  fi ;;
              esac
            done
          done
          echo "Jars de Robolectric precargados en $base."

      - name: Compilar
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            python3 ci/annotate-build-log.py build-output.log
          fi
          exit "$build_status"

      - name: Publicar el APK
        uses: actions/upload-artifact@v7
        with:
          name: fnf-mod-maker-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Registrar pruebas fallidas en un issue
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo
            python3 ci/report-test-failures.py
          } > test-failures.md || true
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Resultados de pruebas fallidas (run #$GITHUB_RUN_NUMBER, commit ${GITHUB_SHA::7})" \
            --body-file test-failures.md
