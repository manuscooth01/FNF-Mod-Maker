# Copia este archivo a .github/workflows/build-apk.yml en GitHub para activar la compilación.
# (La integración de Arena no tiene permiso para escribir en .github/workflows.)

name: Build APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de depuración
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: fnf-mod-maker-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
